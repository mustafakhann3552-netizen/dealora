


<section class="hero-section">

    <div class="container">

        <div id="heroSlider"
             class="carousel slide carousel-fade"
             data-bs-ride="carousel">

            <!-- Indicators -->

            <div class="carousel-indicators">

                <button
                    type="button"
                    data-bs-target="#heroSlider"
                    data-bs-slide-to="0"
                    class="active">
                </button>

                <button
                    type="button"
                    data-bs-target="#heroSlider"
                    data-bs-slide-to="1">
                </button>

                <button
                    type="button"
                    data-bs-target="#heroSlider"
                    data-bs-slide-to="2">
                </button>

            </div>

            <!-- Slides -->

            <div class="carousel-inner">

                <!-- Slide 1 -->

                <div class="carousel-item active">

                    <img
                        src="{{ url_for('static', filename='images/hero1.jpg') }}"
                        class="d-block w-100 hero-image"
                        alt="Hero">

                    <div class="carousel-caption">

                        <h1>Up To 70% OFF</h1>

                        <p>Latest Deals & Coupons</p>

                        <a
                            href="/deals"
                            class="btn btn-warning btn-lg">

                            Shop Now

                        </a>

                    </div>

                </div>

                <!-- Slide 2 -->

                <div class="carousel-item">

                    <img
                        src="{{ url_for('static', filename='images/hero2.jpg') }}"
                        class="d-block w-100 hero-image"
                        alt="Hero">

                    <div class="carousel-caption">

                        <h1>Today's Best Deals</h1>

                        <p>Save More Every Day</p>

                        <a
                            href="/deals"
                            class="btn btn-warning btn-lg">

                            Explore

                        </a>

                    </div>

                </div>

                <!-- Slide 3 -->

                <div class="carousel-item">

                    <img
                        src="{{ url_for('static', filename='images/hero3.jpg') }}"
                        class="d-block w-100 hero-image"
                        alt="Hero">

                    <div class="carousel-caption">

                        <h1>Exclusive Offers</h1>

                        <p>Best Affiliate Discounts</p>

                        <a
                            href="/deals"
                            class="btn btn-warning btn-lg">

                            Get Deal

                        </a>

                    </div>

                </div>

            </div>

            <!-- Controls -->

            <button
                class="carousel-control-prev"
                type="button"
                data-bs-target="#heroSlider"
                data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>

            <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#heroSlider"
                data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>

        </div>

    </div>

</section>
