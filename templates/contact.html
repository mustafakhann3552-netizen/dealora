{% extends "base.html" %}

{% block title %}Contact Us{% endblock %}

{% block content %}

<!-- Hero -->

<section class="bg-dark text-white py-5">

    <div class="container text-center">

        <h1 class="display-4 fw-bold">

            Contact Us

        </h1>

        <p class="lead">

            We'd love to hear from you.

        </p>

    </div>

</section>

<!-- Contact -->

<section class="container py-5">

    <div class="row">

        <div class="col-lg-7">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h3 class="mb-4">

                        Send us a Message

                    </h3>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Full Name

                            </label>
                            <input type="text" name="name" class="form-control" required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input type="email" name="email" class="form-control" required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Subject

                            </label>

                            <input type="text" name="subject" class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Message

                            </label>

                            <textarea name="message" class="form-control" rows="6" required></textarea>

                        </div>

                        <button class="btn btn-primary">

                            Send Message

                        </button>

                    </form>

                </div>

            </div>

        </div>

        <div class="col-lg-5">

            <div class="card shadow border-0 h-100">

                <div class="card-body p-4">

                    <h3 class="fw-bold mb-4">
                        Contact Information
                    </h3>

                    <div class="mb-4">

                        <h6>
                            <i class="bi bi-envelope-fill text-primary me-2"></i>
                            Email
                        </h6>

                        <p class="text-muted">
                            info@dealoftheday.pk
                        </p>

                    </div>

                    <div class="mb-4">

                        <h6>
                            <i class="bi bi-telephone-fill text-success me-2"></i>
                            Phone
                        </h6>

                        <p class="text-muted">
                            +92 300 1234567
                        </p>

                    </div>

                    <div class="mb-4">

                        <h6>
                            <i class="bi bi-geo-alt-fill text-danger me-2"></i>
                            Address
                        </h6>

                        <p class="text-muted">
                            Lahore, Pakistan
                        </p>

                    </div>

                    <hr>

                    <h5 class="fw-bold mb-3">
                        Follow Us
                    </h5>

                    <div class="d-flex gap-3 fs-3">

                        <a href="https://facebook.com" target="_blank" class="text-primary">
                            <i class="bi bi-facebook"></i>
                        </a>

                        <a href="https://instagram.com" target="_blank" class="text-danger">
                            <i class="bi bi-instagram"></i>
                        </a>

                        <a href="https://youtube.com" target="_blank" class="text-danger">
                            <i class="bi bi-youtube"></i>
                        </a>

                        <a href="https://linkedin.com" target="_blank" class="text-primary">
                            <i class="bi bi-linkedin"></i>
                        </a>

                        <a href="https://x.com" target="_blank" class="text-dark">
                            <i class="bi bi-twitter-x"></i>
                        </a>

                    </div>

                </div>

            </div>

        </div> <!-- End col-lg-5 -->

    </div> <!-- End row -->

</section>

<!-- Google Map -->

<section>

    <iframe src="https://maps.google.com/maps?q=Lahore&t=&z=13&ie=UTF8&iwloc=&output=embed" width="100%" height="450"
        style="border:0;" loading="lazy">
    </iframe>

</section>

{% endblock %}
