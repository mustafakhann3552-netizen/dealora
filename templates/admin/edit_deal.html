{% extends "base.html" %}

{% block title %}Edit Deal{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="row">

        <div class="col-lg-10 mx-auto">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-warning text-dark">

                    <h3 class="mb-0">
                        Edit Deal
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST" enctype="multipart/form-data">

                        <!-- Product Image -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Product Image
                            </label>

                            <input
                                type="file"
                                class="form-control"
                                name="image"
                                id="imageInput">

                            <div class="mt-3">

                                {% if deal.image %}

                                <img
                                    id="preview"
                                    src="{{ url_for('static', filename='uploads/' + deal.image) }}"
                                    class="img-thumbnail"
                                    style="max-height:220px;">

                                {% else %}

                                <img
                                    id="preview"
                                    src=""
                                    class="img-thumbnail"
                                    style="max-height:220px;display:none;">

                                {% endif %}

                            </div>

                        </div>

                        <!-- Program Logo -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Program Logo
                            </label>

                            <input
                                type="file"
                                class="form-control"
                                name="program_logo"
                                id="programLogoInput">

                            <div class="mt-3">

                                {% if deal.program_logo %}

                                <img
                                    id="programLogoPreview"
                                    src="{{ url_for('static', filename='uploads/' + deal.program_logo) }}"
                                    class="img-thumbnail"
                                    style="max-height:100px;">

                                {% else %}

                                <img
                                    id="programLogoPreview"
                                    src=""
                                    class="img-thumbnail"
                                    style="max-height:100px;display:none;">

                                {% endif %}

                            </div>

                        </div>

                        <!-- Title -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Product Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                value="{{ deal.title }}"
                                required>

                        </div>

                        <!-- Slug -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Slug
                            </label>

                            <input
                                type="text"
                                name="slug"
                                class="form-control"
                                value="{{ deal.slug }}"
                                required>

                        </div>

                        <!-- Description -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="5">{{ deal.short_description }}</textarea>

                        </div>

                        <!-- Affiliate URL -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Affiliate URL
                            </label>

                            <input
                                type="url"
                                name="affiliate_url"
                                class="form-control"
                                value="{{ deal.affiliate_url }}"
                                required>

                        </div>

                        <!-- Prices -->

                        <div class="row">

                            <div class="col-md-4">

                                <label class="form-label fw-bold">
                                    Old Price
                                </label>

                                <input
                                    type="number"
                                    name="old_price"
                                    class="form-control"
                                    value="{{ deal.old_price }}">

                            </div>

                            <div class="col-md-4">

                                <label class="form-label fw-bold">
                                    New Price
                                </label>

                                <input
                                    type="number"
                                    name="new_price"
                                    class="form-control"
                                    value="{{ deal.new_price }}">

                            </div>

                            <div class="col-md-4">

                                <label class="form-label fw-bold">
                                    Discount %
                                </label>

                                <input
                                    type="number"
                                    name="discount"
                                    class="form-control"
                                    value="{{ deal.discount }}">

                            </div>

                        </div>

                        <hr>

                        <!-- Button -->

                        <div class="row">

                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Button Text
                                </label>

                                <input
                                    type="text"
                                    name="button_text"
                                    class="form-control"
                                    value="{{ deal.button_text }}">

                            </div>

                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Badge
                                </label>

                                <input
                                    type="text"
                                    name="badge"
                                    class="form-control"
                                    value="{{ deal.badge }}">

                            </div>

                        </div>

                        <hr>

                        <!-- Store -->

                        <div class="row">

                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Store
                                </label>

                                <select
                                    class="form-select"
                                    name="store"
                                    required>

                                    {% for store in stores %}

                                    <option
                                        value="{{ store.id }}"
                                        {% if deal.store_id == store.id %}selected{% endif %}>

                                        {{ store.name }}

                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                            <!-- Category -->

                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Category
                                </label>

                                <select
                                    class="form-select"
                                    name="category"
                                    required>

                                    {% for category in categories %}

                                    <option
                                        value="{{ category.id }}"
                                        {% if deal.category_id == category.id %}selected{% endif %}>

                                        {{ category.name }}

                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                        </div>

                        <hr>

                        <!-- Featured -->

                        <div class="form-check form-switch mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="featured"
                                {% if deal.featured %}checked{% endif %}>

                            <label class="form-check-label">
                                Show On Homepage
                            </label>

                        </div>

                        <!-- Buttons -->

                        <div class="d-flex justify-content-end gap-2">

                            <a
                                href="{{ url_for('admin.deals') }}"
                                class="btn btn-secondary">

                                Cancel

                            </a>

                            <button
                                type="submit"
                                class="btn btn-warning">

                                Update Deal

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");

imageInput.onchange = function(e){

    const file = e.target.files[0];

    if(file){

        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";

    }

};

const logoInput = document.getElementById("programLogoInput");
const logoPreview = document.getElementById("programLogoPreview");

logoInput.onchange = function(e){

    const file = e.target.files[0];

    if(file){

        logoPreview.src = URL.createObjectURL(file);
        logoPreview.style.display = "block";

    }

};

</script>

{% endblock %}
