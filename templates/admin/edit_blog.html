{% extends "base.html" %}

{% block title %}Edit Blog{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="row">

        <div class="col-lg-10 mx-auto">

            <div class="card shadow-lg border-0">

                <!-- Header -->

                <div class="card-header bg-warning text-dark">

                    <h3 class="mb-0">
                        Edit Blog
                    </h3>

                </div>

                <!-- Body -->

                <div class="card-body">

                    <form method="POST" enctype="multipart/form-data">

                        <!-- Blog Image -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Blog Image
                            </label>

                            <input
                                type="file"
                                class="form-control"
                                name="image"
                                id="imageInput"
                                accept="image/*">

                            <div class="mt-3">

                                {% if blog.image %}

                                <img
                                    id="preview"
                                    src="{{ url_for('static', filename='uploads/' + blog.image) }}"
                                    class="img-thumbnail"
                                    style="max-height:220px;">

                                {% else %}

                                <img
                                    id="preview"
                                    src=""
                                    class="img-thumbnail"
                                    style="max-height:220px;display:none;">

                                {% endif %}

                            </div>

                        </div>

                        <!-- Blog Title -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Blog Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                value="{{ blog.title }}"
                                required>

                        </div>

                        <!-- Slug -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Slug
                            </label>

                            <input
                                type="text"
                                name="slug"
                                class="form-control"
                                value="{{ blog.slug }}"
                                required>

                        </div>

                        <!-- Description -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Description
                            </label>

                            <textarea
                                class="form-control"
                                rows="8"
                                name="description">{{ blog.short_description }}</textarea>

                        </div>

                        <!-- Buttons -->

                        <div class="d-flex justify-content-end gap-2">

                            <a
                                href="{{ url_for('admin.blogs') }}"
                                class="btn btn-secondary">

                                Cancel

                            </a>

                            <button
                                type="submit"
                                class="btn btn-warning">

                                Update Blog

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const imageInput = document.getElementById("imageInput");

const preview = document.getElementById("preview");

imageInput.onchange = function(e){

    const file = e.target.files[0];

    if(file){

        preview.src = URL.createObjectURL(file);

        preview.style.display = "block";

    }

};

</script>

{% endblock %}
