{% extends "base.html" %}

{% block title %}Categories{% endblock %}

{% block content %}

<div class="container py-5">

<h2>Categories</h2>

<a href="/admin/categories/add"
class="btn btn-primary mb-3">

Add Category

</a>

<table class="table">

<tr>

<th>ID</th>

<th>Name</th>

</tr>

{% for category in categories %}

<tr>

<td>{{ category.id }}</td>

<td>{{ category.name }}</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
