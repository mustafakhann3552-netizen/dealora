{% extends "base.html" %}

{% block title %}Add New Deal{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="row">

        <div class="col-lg-10 mx-auto">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">
                        Add New Deal
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST" enctype="multipart/form-data">

                        <!-- Image -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Product Image

                            </label>

                            <input type="file" class="form-control" name="image" id="imageInput">

                            <div class="mt-3">

                                <img id="preview" src="" class="img-thumbnail" style="max-height:220px;display:none;">

                            </div>

                        </div>

                        <!-- Title -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Product Title

                            </label>

                            <input type="text" name="title" class="form-control" required>

                        </div>


                        <hr>

                        <!-- Affiliate Program Logo -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Affiliate Program Logo

                            </label>

                            <input type="file" class="form-control" name="program_logo" id="programLogoInput"
                                accept="image/*">

                            <div class="mt-3">

                                <img id="programLogoPreview" src="" class="img-thumbnail"
                                    style="max-height:100px;display:none;">

                            </div>

                        </div>

                        <!-- Slug -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Slug

                            </label>
                            <input type="text" class="form-control" name="slug" placeholder="iphone-16-pro-max"
                                required>

                        </div>

                        <!-- Description -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Short Description

                            </label>

                            <textarea class="form-control" rows="5" name="short_description"
                                placeholder="Write a short description about this deal..."></textarea>

                        </div>

                        <!-- Affiliate -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Affiliate URL

                            </label>

                            <input type="url" class="form-control" name="affiliate_url"
                                placeholder="https://example.com/product" required>

                        </div>

                      

                        <!-- Prices -->

                        <div class="row">

                            <div class="col-md-4">

                                <label class="form-label fw-bold">

                                    Old Price

                                </label>
                                <input type="number" step="0.01" class="form-control" name="old_price">

                            </div>

                            <div class="col-md-4">

                                <label class="form-label fw-bold">

                                    New Price

                                </label>

                                <input type="number" step="0.01" class="form-control" name="new_price">

                            </div>

                            <div class="col-md-4">

                                <label class="form-label fw-bold">

                                    Discount %

                                </label>

                                <input type="number" class="form-control" name="discount">

                            </div>

                        </div>

                        <hr>

                        <div class="row">

                            <div class="col-md-6">

                                <label class="form-label fw-bold">

                                    Button Text

                                </label>

                                <input type="text" class="form-control" name="button_text" value="Veiw Deal">

                            </div>

                            <div class="col-md-6">

                                <label class="form-label fw-bold">

                                    Deal Badge

                                </label>

                                <input type="text" class="form-control" name="badge" placeholder="Best Seller">

                            </div>

                        </div>

                        <hr>

                        <div class="row">

                            <div class="col-md-6">

                                <label class="form-label fw-bold">

                                    Store

                                </label>

                                <select class="form-select" name="store" required>

                                    <option value="">Select Store</option>

                                    {% for store in stores %}

                                    <option value="{{ store.id }}">

                                        {{ store.name }}

                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label fw-bold">

                                    Category

                                </label>

                                <select class="form-select" name="category" required>

                                    <option value="">Select Category</option>

                                    {% for category in categories %}

                                    <option value="{{ category.id }}">

                                        {{ category.name }}

                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                        </div>

                        <hr>

                        <div class="form-check form-switch">

                            <input class="form-check-input" type="checkbox" name="featured">

                            <label class="form-check-label">

                                Show On Homepage

                            </label>

                        </div>
                        <div class="d-flex justify-content-end gap-2">

                            <a href="{{ url_for('admin.deals') }}" class="btn btn-secondary">

                                Cancel

                            </a>

                            <button type="submit" class="btn btn-primary">

                                Save Deal

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");

    imageInput.onchange = e => {

        const file = e.target.files[0];

        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        }

    };

    const logoInput = document.getElementById("programLogoInput");
    const logoPreview = document.getElementById("programLogoPreview");

    logoInput.onchange = e => {

        const file = e.target.files[0];

        if (file) {
            logoPreview.src = URL.createObjectURL(file);
            logoPreview.style.display = "block";
        }

    };

</script>

{% endblock %}
